<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Math Fun</title>
    <meta name="description" content="Silly, encouraging math games." />
    <meta name="theme-color" content="#2ec4f1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Math Fun" />
    <link rel="apple-touch-icon" href="/math-fun/icons/apple-touch-icon-180.png" />
    <link rel="icon" type="image/png" href="/math-fun/icons/favicon-64.png" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #2ec4f1;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        position: fixed;
        inset: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #9b5de5;
        color: #fff;
        font: bold 40px "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
        text-align: center;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 36px;
        text-shadow: 0 4px 0 #22223b;
      }
      #rotate .tablet {
        width: 120px;
        height: 170px;
        border: 10px solid #22223b;
        border-radius: 22px;
        background: #ffd60a;
        animation: turn 1.8s ease-in-out infinite;
      }
      @keyframes turn {
        0%, 20% { transform: rotate(0deg); }
        60%, 100% { transform: rotate(-90deg); }
      }
      @media (orientation: portrait) {
        #rotate { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate" aria-live="polite">
      <div class="tablet"></div>
      <div>Turn me sideways!</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
